<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Estonia Company Finder</title>
<meta name="robots" content="noindex">
<style>
  :root { --blue:#1b4f8c; --border:#d6dde3; --bg:#f5f7f9; }
  * { box-sizing:border-box; }
  body {
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg); color:#1c1c1c; margin:0;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }
  .card {
    background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:2.25rem; max-width:380px; width:100%;
  }
  h1 { font-size:1.2rem; margin:0 0 .3rem; }
  .sub { color:#667; font-size:.85rem; margin-bottom:1.4rem; }
  label { display:block; font-size:.82rem; font-weight:600; margin:0 0 .3rem; color:#333; }
  input {
    width:100%; padding:.6rem .7rem; border:1px solid var(--border);
    border-radius:7px; font-size:.95rem; margin-bottom:1rem;
  }
  button {
    width:100%; background:var(--blue); color:#fff; border:0; border-radius:8px;
    padding:.7rem 1rem; font-size:1rem; font-weight:600; cursor:pointer;
  }
  button:hover { background:#163f70; }
  .error {
    background:#fdecea; border:1px solid #f3c2bd; color:#8a2c22;
    padding:.6rem .8rem; border-radius:7px; font-size:.85rem; margin-bottom:1rem;
  }
  .back { display:inline-block; margin-top:1rem; font-size:.82rem; color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Estonia Company Finder</h1>
    <div class="sub">Internal tool — sign in to continue.</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <a class="back" href="/">&larr; About this tool</a>
  </div>
</body>
</html>
