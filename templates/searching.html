<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇪</text></svg>">
<title>Searching… · Estonia Company Finder</title>
<meta name="robots" content="noindex">
<style>
  :root { --blue:#1b4f8c; --border:#d6dde3; --bg:#f5f7f9; }
  * { box-sizing:border-box; }
  body {
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg); color:#1c1c1c; margin:0;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1rem;
  }
  .box { text-align:center; max-width:420px; }
  .spinner {
    width:2.5rem; height:2.5rem; margin:0 auto 1rem;
    border:4px solid var(--border); border-top-color:var(--blue);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:1.1rem; margin:0 0 .4rem; }
  .status { color:#778; font-size:.85rem; min-height:1.2em; }
  .error {
    background:#fdecea; border:1px solid #f3c2bd; color:#8a2c22;
    padding:.8rem 1rem; border-radius:8px; font-size:.9rem; text-align:left;
  }
  .back {
    display:inline-block; margin-top:1rem; color:var(--blue);
    text-decoration:none; font-weight:600; font-size:.9rem;
  }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <div id="working">
    <div class="spinner"></div>
    <h1>Searching…</h1>
    <div id="status" class="status"></div>
  </div>
  <div id="failed" hidden>
    <div id="error" class="error"></div>
    <a class="back" href="/">&larr; Back to search</a>
  </div>
</div>
<script>
(function () {
  var statusUrl = "/search/status/{{ job_id }}";
  var working = document.getElementById("working");
  var failed = document.getElementById("failed");
  var statusEl = document.getElementById("status");
  var errorEl = document.getElementById("error");

  function fail(message) {
    working.hidden = true;
    errorEl.textContent = message;
    failed.hidden = false;
  }

  function poll() {
    fetch(statusUrl, { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) { fail("This search was interrupted (the server restarted). Please run it again."); return null; }
        return r.json();
      })
      .then(function (s) {
        if (!s) return;
        if (s.state === "done") { window.location.replace(s.url); return; }
        if (s.state === "error") { fail(s.error || "The search failed."); return; }
        statusEl.textContent = s.message || "";
        setTimeout(poll, 1500);
      })
      .catch(function () { setTimeout(poll, 3000); });
  }
  poll();
})();
</script>
</body>
</html>
